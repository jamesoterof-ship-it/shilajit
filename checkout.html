<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirma tu pedido · Jaye Group Chile</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@200;300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@200;300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="tienda.css?v=47">
<style>
  .caja{max-width:560px;margin:0 auto;padding:0 16px 40px}
  .resumen{background:var(--gris);border:1px solid var(--linea);padding:16px;margin:18px 0 22px;
           display:flex;gap:14px;align-items:center}
  .resumen .im{width:66px;height:66px;flex:none;background:#fff;border:1px solid var(--linea);
               display:flex;align-items:center;justify-content:center;overflow:hidden}
  .resumen .im img{width:100%;height:100%;object-fit:cover}
  .resumen .im span{font-family:'Barlow Condensed','Inter',sans-serif;font-size:30px;font-weight:800;
                    color:rgba(23,21,15,.2)}
  .resumen .info{flex:1;min-width:0}
  .resumen h2{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;text-transform:uppercase;
              font-size:17px;margin:0 0 3px;letter-spacing:.01em}
  .resumen .qt{font-size:12.5px;color:var(--suave)}
  .resumen .pz{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;font-size:24px;
               font-variant-numeric:tabular-nums;white-space:nowrap}
  h1.tit{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
         font-size:30px;margin:22px 0 4px;letter-spacing:.02em}
  .ayuda{color:var(--suave);font-size:14px;margin:0 0 6px}
  label{display:block;margin:14px 0 5px;font-family:'Barlow Condensed','Inter',sans-serif;
        font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
  input,select{width:100%;border:1px solid var(--linea);padding:12px 13px;font-size:15px;
               font-family:inherit;background:#fff;color:var(--tinta);border-radius:0}
  input:focus,select:focus{outline:2px solid var(--negro);outline-offset:-2px;border-color:var(--negro)}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .enviar{display:block;width:100%;background:var(--negro);color:#fff;border:0;margin-top:22px;
          font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
          letter-spacing:.08em;font-size:18px;padding:16px;cursor:pointer}
  .enviar:hover{background:#2A2724}
  .enviar[disabled]{opacity:.55;cursor:default}
  .aviso{margin-top:12px;font-size:13px;color:var(--suave);text-align:center}
  .error{color:#B3261E;font-size:13px;margin-top:6px;font-weight:600}
  .listo{text-align:center;padding:40px 16px}
  .listo .tic{width:64px;height:64px;margin:0 auto 16px;border:3px solid var(--negro);border-radius:50%;
              display:flex;align-items:center;justify-content:center}
  .listo h1{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
            font-size:32px;margin:0 0 8px}
  .listo p{color:var(--suave);margin:0 auto 20px;max-width:40ch}
</style>
<script>
/* Evita el parpadeo del logo: se muestra cuando la tipografia ya cargo,
   y si tarda demasiado se muestra igual a los 400 ms. */
(function(){var d=document.documentElement;
 var ya=function(){d.classList.add("fuentesListas")};
 if(document.fonts&&document.fonts.ready){document.fonts.ready.then(ya)}else{ya()}
 setTimeout(ya,400);})();
</script>
</head>
<body>

  <div class="marq" aria-label="Avisos">
    <div class="pista">
      <span>Envío gratis a todo Chile</span><span>·</span>
      <span>Pagas cuando lo recibes</span><span>·</span>
      <span>Despacho en 2 a 4 días</span><span>·</span>
      <span>Envío gratis a todo Chile</span><span>·</span>
      <span>Pagas cuando lo recibes</span><span>·</span>
      <span>Despacho en 2 a 4 días</span><span>·</span>
    </div>
  </div>

  <header class="top">
    <div class="fila">
      <a class="hamb" href="javascript:history.back()" aria-label="Volver">
        <svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
      <a class="logo" href="/"><span class="j">JAYE</span><i class="raya"></i><span class="g">GROUP</span></a>
      <span style="width:20px"></span>
    </div>
  </header>

  <main class="caja" id="caja"></main>

  <footer class="pie">
    <div class="envoltorio">
      <div class="logo"><span class="j" style="color:#fff">JAYE</span><i class="raya"></i><span class="g" style="color:#fff">GROUP</span></div>
      <small>Despacho a todo Chile · Pago contra entrega</small>
    </div>
  </footer>

<script src="productos.js?v=1"></script>
<script src="chile-regiones.js"></script>
<script>
(function () {
  'use strict';
  var URL_PEDIDO = 'https://n8n-production-8a42.up.railway.app/webhook/pedido-tienda';
  var pesos = function (n) { return '$' + Number(n).toLocaleString('es-CL'); };
  var q = new URLSearchParams(location.search);
  var p = (window.PRODUCTOS || []).find(function (x) { return x.id === q.get('p'); });
  var caja = document.getElementById('caja');

  if (!p) { location.href = '/'; return; }

  var pack = p.packs[Number(q.get('pack')) || 0] || p.packs[0];
  // candado: el precio tiene que estar en la lista aprobada
  if ((window.PRECIOS_APROBADOS || []).indexOf(pack.precio) < 0) { location.href = '/'; return; }

  var img = p.foto
    ? '<img src="' + p.foto + '" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'' + p.nombre.charAt(0) + '\'}))">'
    : '<span>' + p.nombre.charAt(0) + '</span>';

  caja.innerHTML =
    '<div class="resumen">'
      + '<div class="im">' + img + '</div>'
      + '<div class="info"><h2>' + p.nombre + '</h2><div class="qt">' + pack.texto + ' · envío gratis</div></div>'
      + '<div class="pz">' + pesos(pack.precio) + '</div>'
    + '</div>'
    + '<h1 class="tit">¿A dónde lo enviamos?</h1>'
    + '<p class="ayuda">No pagas nada ahora. Pagas cuando el repartidor te lo entregue.</p>'
    + '<form id="f" novalidate>'
      + '<label for="nombre">Nombre y apellido</label>'
      + '<input id="nombre" name="nombre" autocomplete="name" required>'
      + '<label for="telefono">WhatsApp</label>'
      + '<div class="dos" style="grid-template-columns:88px 1fr">'
        + '<input id="indicativo" name="indicativo" value="+56" readonly>'
        + '<input id="telefono" name="telefono" inputmode="numeric" autocomplete="tel" placeholder="9 1234 5678" required>'
      + '</div>'
      + '<label for="region">Región</label>'
      + '<select id="region" name="region" required><option value="">Elige tu región</option></select>'
      + '<label for="comuna">Comuna</label>'
      + '<select id="comuna" name="comuna" required><option value="">Elige tu comuna</option></select>'
      + '<label for="direccion">Dirección de entrega</label>'
      + '<input id="direccion" name="direccion" autocomplete="street-address" placeholder="Calle y número, o el camino y una referencia" required>'
      + '<div class="error" id="err" hidden></div>'
      + '<button class="enviar" type="submit">Confirmar pedido</button>'
      + '<p class="aviso">Al confirmar, te escribimos por WhatsApp para coordinar la entrega.</p>'
    + '</form>';

  // regiones y comunas de Chile, del archivo que ya usa la landing
  var R = window.CHILE_REGIONES || window.REGIONES || null;
  var selR = document.getElementById('region'), selC = document.getElementById('comuna');
  if (R) {
    var nombres = Array.isArray(R) ? R.map(function (x) { return x.region || x.nombre || x; }) : Object.keys(R);
    nombres.forEach(function (n) { selR.insertAdjacentHTML('beforeend', '<option>' + n + '</option>'); });
    selR.addEventListener('change', function () {
      var v = selR.value, comunas = [];
      if (Array.isArray(R)) {
        var f = R.find(function (x) { return (x.region || x.nombre) === v; });
        comunas = f ? (f.comunas || f.communes || []) : [];
      } else comunas = R[v] || [];
      selC.innerHTML = '<option value="">Elige tu comuna</option>'
        + comunas.map(function (c) { return '<option>' + (c.name || c) + '</option>'; }).join('');
    });
  } else {
    // si no cargo el listado, se escriben a mano y no se bloquea la venta
    selR.outerHTML = '<input id="region" name="region" placeholder="Tu región" required>';
    selC.outerHTML = '<input id="comuna" name="comuna" placeholder="Tu comuna" required>';
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var g = function (id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    var err = document.getElementById('err');
    var tel = g('telefono').replace(/\D/g, '');
    var dir = g('direccion');

    // los mismos candados de Camila: sin datos no se registra
    if (g('nombre').length < 3) return fallo('Escribe tu nombre y apellido.');
    if (tel.length < 8) return fallo('Revisa tu número de WhatsApp.');
    if (!g('region')) return fallo('Elige tu región.');
    if (!g('comuna')) return fallo('Elige tu comuna.');
    if (dir.length < 8) return fallo('Necesitamos la dirección. Si es en el campo, pon el camino o sector y una referencia.');

    function fallo(m) { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: 'center' }); return false; }
    err.hidden = true;

    var btn = e.target.querySelector('.enviar');
    btn.disabled = true; btn.textContent = 'Enviando…';

    fetch(URL_PEDIDO, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: g('nombre'), indicativo: '+56', telefono: tel,
        producto: p.nombre, precio: pack.precio, cantidad: pack.cant,
        direccion: dir, comuna: g('comuna'), region: g('region'),
        origen: 'tienda', pais: 'CL',
      }),
    }).then(function () { gracias(); })
      .catch(function () { gracias(); });   // el pedido igual queda: no se le muestra un error al cliente
  });

  function gracias() {
    caja.innerHTML =
      '<div class="listo">'
      + '<div class="tic"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px;stroke-width:2.6"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>'
      + '<h1>¡Pedido confirmado!</h1>'
      + '<p>Te escribimos por WhatsApp para coordinar la entrega. Llega en 2 a 4 días hábiles y pagas cuando lo recibas.</p>'
      + '<a class="cta" href="/">Seguir viendo</a>'
      + '</div>';
    window.scrollTo(0, 0);
  }
})();
</script>
</body>
</html>
