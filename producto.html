<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaye Group Chile · Producto</title>
<meta name="description" content="Envío gratis a todo Chile y pagas cuando lo recibes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@200;300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="tienda.css?v=50">
<style>
/* ============================================================
   FICHA DE PRODUCTO
   El orden lo definio el dueno: galeria, estrellas, precio y nombre,
   promocion, descripcion, resenas, preguntas, sellos, otros productos y
   el formulario al final.
   Aca (y SOLO aca, no en la tienda) se usan rojo y azul para los botones
   que empujan la venta.
   ============================================================ */
:root{ --rojo:#C4122F; --azul:#123C8C; }
.prod{max-width:var(--maxw);margin:0 auto;padding:0 0 8px}

/* ---- 1. galeria ---- */
.gal{position:relative;background:#F2F1EE}
.gal .marco{aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gal .marco img{width:100%;height:100%;object-fit:cover;display:block}
.gal .vacio{font-family:'Barlow Condensed','Inter',sans-serif;font-size:110px;font-weight:800;
            color:rgba(23,21,15,.13)}
.gal .flecha{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border:0;background:rgba(255,255,255,.92);cursor:pointer;display:flex;align-items:center;
  justify-content:center;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.14);color:var(--tinta)}
.gal .flecha.izq{left:10px} .gal .flecha.der{right:10px}
.gal .flecha svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.gal .puntos{display:flex;gap:7px;justify-content:center;padding:12px 0 0}
.gal .puntos button{width:7px;height:7px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--linea);transition:.2s}
.gal .puntos button[aria-current="true"]{background:var(--tinta);width:20px;border-radius:99px}
.miniz{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.miniz::-webkit-scrollbar{display:none}
.miniz button{flex:none;width:58px;height:58px;border:1px solid var(--linea);background:#F2F1EE;
  padding:0;cursor:pointer;overflow:hidden}
.miniz button[aria-current="true"]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.miniz img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- 2. estrellas ---- */
.estrellas{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.estrellas .est{display:inline-flex;gap:2px}
.estrellas svg{width:15px;height:15px;fill:var(--oro)}
.estrellas .cuantas{font-size:13px;color:var(--suave)}
.estrellas .cuantas a{color:var(--suave);text-decoration:underline;text-underline-offset:2px}

/* ---- 3. precio y nombre ---- */
.prod .datos{padding:16px 16px 0}
.prod h1{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(28px,7vw,40px);line-height:.95;margin:0 0 8px;letter-spacing:.01em}
.prod .sub{color:var(--suave);font-size:15px;margin:0 0 14px}
.prod .nota{font-size:13px;color:var(--oro-osc);font-weight:700;margin:0 0 16px}
.precioTop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.precioTop .ahora{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;
  font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--tinta)}
.precioTop .antes{font-size:15px;color:#A29C90;text-decoration:line-through}
.precioTop .off{background:var(--rojo);color:#fff;font-family:'Barlow Condensed','Inter',sans-serif;
  font-weight:700;font-size:12px;letter-spacing:.06em;padding:3px 8px;text-transform:uppercase}

/* ---- 4. promocion / packs ---- */
.bloque{padding:26px 16px 0}
.bloque > h2{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
  font-size:20px;letter-spacing:.03em;margin:0 0 14px;color:var(--tinta);display:flex;align-items:center;gap:10px}
.bloque > h2::before{content:'';width:22px;height:2px;background:var(--oro);flex:none}
.packs{display:grid;gap:10px}
.pack{display:flex;align-items:center;gap:12px;border:1px solid var(--linea);padding:13px 14px;
  cursor:pointer;background:#fff;text-align:left;width:100%;position:relative;transition:.18s}
.pack:hover{border-color:var(--suave)}
.pack[aria-pressed="true"]{border-color:var(--negro);box-shadow:inset 0 0 0 1px var(--negro)}
.pack .marca{width:18px;height:18px;border:2px solid var(--linea);border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center}
.pack[aria-pressed="true"] .marca{border-color:var(--negro)}
.pack[aria-pressed="true"] .marca::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--negro)}
.pack .qt{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:16px;flex:1;letter-spacing:.02em}
.pack .pz{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;font-size:21px;
  font-variant-numeric:tabular-nums}
.pack .an{font-size:12px;color:#A29C90;text-decoration:line-through;margin-left:6px}
/* el pack mas pedido: el precio late y cambia de color, para que se note */
.pack.esPopular{border-color:var(--rojo)}
.pack.esPopular .pz{animation:latir 1.9s ease-in-out infinite}
@keyframes latir{
  0%,100%{ transform:scale(1); color:var(--tinta) }
  50%    { transform:scale(1.08); color:var(--rojo) }
}
.cinta{position:absolute;top:-9px;left:12px;background:var(--rojo);color:#fff;
  font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.09em;padding:3px 9px}
@media (prefers-reduced-motion:reduce){ .pack.esPopular .pz{animation:none;color:var(--rojo)} }

/* ---- botones que empujan la venta (rojo y azul, solo en esta pagina) ---- */
.cta{display:block;width:100%;border:0;cursor:pointer;text-align:center;text-decoration:none;
  font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;font-size:17px;padding:16px;position:relative;overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(0)}
.cta.rojo{background:var(--rojo);color:#fff;box-shadow:0 6px 18px rgba(196,18,47,.28)}
.cta.rojo:hover{box-shadow:0 10px 26px rgba(196,18,47,.36)}
.cta.azul{background:var(--azul);color:#fff;box-shadow:0 6px 18px rgba(18,60,140,.26)}
.cta.azul:hover{box-shadow:0 10px 26px rgba(18,60,140,.34)}
.cta.negro{background:var(--negro);color:#fff}
/* un brillo que cruza el boton cada tanto: llama sin marear */
.cta::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);
  animation:brillo 3.4s ease-in-out infinite}
@keyframes brillo{ 0%{left:-60%} 55%,100%{left:130%} }
@media (prefers-reduced-motion:reduce){ .cta::after{animation:none;display:none} .cta:hover{transform:none} }
.ctaSub{text-align:center;font-size:12.5px;color:var(--suave);margin-top:9px}

/* ---- 5. descripcion ---- */
.desc p{font-size:15.5px;line-height:1.75;color:var(--suave);margin:0 0 14px}
.desc ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.desc li{position:relative;padding-left:26px;font-size:15px;color:var(--tinta);line-height:1.55}
.desc li::before{content:'';position:absolute;left:0;top:.36em;width:14px;height:14px;
  border-radius:50%;background:var(--oro);opacity:.22}
.desc li::after{content:'';position:absolute;left:4.5px;top:.63em;width:5px;height:8px;
  border-right:2px solid var(--oro-osc);border-bottom:2px solid var(--oro-osc);transform:rotate(42deg)}

/* ---- 6. resenas ---- */
.rs{display:grid;gap:12px}
.rsc{border:1px solid var(--linea);background:#fff;padding:14px 15px}
.rsc .arriba{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.rsc .ini{width:32px;height:32px;border-radius:50%;background:var(--gris);flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--suave)}
.rsc .quien{flex:1;font-weight:700;font-size:14px;color:var(--tinta);line-height:1.2}
.rsc .quien small{display:block;font-weight:400;font-size:11.5px;color:var(--suave)}
.rsc .est{display:inline-flex;gap:1px}
.rsc .est svg{width:13px;height:13px;fill:var(--oro)}
.rsc p{margin:0;font-size:14.5px;line-height:1.65;color:var(--suave)}
.masRs{margin-top:12px;background:#fff;border:1px solid var(--linea);color:var(--tinta);
  font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:13.5px;padding:12px;width:100%;cursor:pointer}
.masRs:hover{border-color:var(--tinta)}

/* ---- 7. preguntas ---- */
.fq{border-top:1px solid var(--linea)}
.fq details{border-bottom:1px solid var(--linea)}
.fq summary{list-style:none;cursor:pointer;padding:15px 34px 15px 0;position:relative;
  font-weight:700;font-size:15px;color:var(--tinta)}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:'';position:absolute;right:6px;top:50%;width:9px;height:9px;
  border-right:2px solid var(--suave);border-bottom:2px solid var(--suave);
  transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.fq details[open] summary::after{transform:translateY(-30%) rotate(225deg)}
.fq details p{margin:0;padding:0 0 16px;font-size:14.5px;line-height:1.7;color:var(--suave)}

/* ---- 8. sellos de las transportadoras ---- */
.sellos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sello{border:1px solid var(--linea);background:#fff;padding:16px 14px;text-align:center}
.sello img{height:26px;width:auto;max-width:100%;object-fit:contain;margin:0 auto 8px;display:block}
.sello .nom{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;font-size:17px;
  letter-spacing:.03em;color:var(--tinta);text-transform:uppercase}
.sello small{display:block;font-size:11.5px;color:var(--suave);margin-top:3px;line-height:1.4}

/* ---- 9. te puede interesar ---- */
.otros{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){ .otros{grid-template-columns:repeat(4,1fr)} }
.oc{border:1px solid var(--linea);background:#fff;text-decoration:none;display:block}
.oc .im{aspect-ratio:1/1;background:#F2F1EE;display:flex;align-items:center;justify-content:center;overflow:hidden}
.oc .im img{width:100%;height:100%;object-fit:cover}
.oc .im span{font-family:'Barlow Condensed','Inter',sans-serif;font-size:46px;font-weight:800;
  color:rgba(23,21,15,.13)}
.oc .tx{padding:10px 11px 12px}
.oc .n{font-weight:700;font-size:13.5px;color:var(--tinta);line-height:1.25;margin-bottom:4px}
.oc .p{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;font-size:17px;color:var(--tinta)}

/* ---- 10. formulario ---- */
.form{background:var(--negro);padding:28px 16px 34px;margin-top:30px}
.form h2{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;text-transform:uppercase;
  font-size:23px;color:#fff;margin:0 0 5px;letter-spacing:.02em;text-align:center}
.form .baj{color:#B5AE9F;font-size:13.5px;text-align:center;margin:0 0 18px}
.form .resu{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.form .resu .qq{flex:1;color:#fff;font-size:14px;line-height:1.35}
.form .resu .qq small{display:block;color:#B5AE9F;font-size:12px}
.form .resu .pp{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:800;font-size:23px;color:#fff}
.form label{display:block;color:#B5AE9F;font-size:12px;font-weight:600;margin:0 0 5px;
  text-transform:uppercase;letter-spacing:.05em}
.form input,.form select,.form textarea{width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-family:inherit;margin-bottom:13px}
.form input::placeholder,.form textarea::placeholder{color:#7C7566}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--oro)}
.form select option{color:#111}
.form .dos{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.form .mal{border-color:var(--rojo) !important}
.form .aviso{color:#FF9BA8;font-size:12.5px;margin:-8px 0 12px;display:none}
.form .listo{background:rgba(255,255,255,.07);border:1px solid var(--oro);padding:22px 18px;text-align:center;color:#fff}
.form .listo h3{font-family:'Barlow Condensed','Inter',sans-serif;font-size:22px;margin:0 0 7px;
  text-transform:uppercase;letter-spacing:.02em}
.form .listo p{color:#B5AE9F;font-size:14px;margin:0;line-height:1.6}

@media (min-width:860px){
  .arriba2{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;
    max-width:var(--maxw);margin:0 auto;padding:20px 16px 0}
  .arriba2 .datos{padding:0}
  .bloque,.form{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  .sellos{grid-template-columns:repeat(4,1fr)}
}
</style>
