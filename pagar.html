<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Paga tu pedido · Jaye Group Chile</title>
<!-- 04-10 James: link PERSONAL de pago (Camila se lo manda por WhatsApp): el cliente solo pone la tarjeta.
     Diseño de la skill ui-ux-pro-max de esta conversación: minimalista, Inter, azul #2563EB, verde #059669 para el descuento,
     fondo #F0F9FF, texto #0F172A. Datos del pedido: n8n pago-info-cl; cobro: paypal-orden-cl / paypal-captura-cl
     (el servidor fija el monto y comprueba el cobro con PayPal). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#2563EB;--verde:#059669;--rojo:#DC2626;--fondo:#F0F9FF;--tinta:#0F172A;--gris:#475569;--borde:#E4ECFC;--blanco:#FFFFFF;--oro:#d8a52e}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.barra{background:var(--tinta);padding:14px 16px;text-align:center}
.marca{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;letter-spacing:.06em}
.marca .j{color:#fff}.marca .g{color:var(--oro);margin-left:6px}
.marco{max-width:440px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:16px;padding:20px}
.prod{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--borde);margin-bottom:14px}
.ico{width:48px;height:48px;border-radius:12px;background:var(--fondo);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;stroke:var(--azul);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prod b{display:block;font-size:15px;font-weight:600}
.prod small{color:var(--gris);font-size:12.5px}
.rot{font-size:12.5px;color:var(--gris);margin:0}
.total{font-size:30px;font-weight:700;margin:2px 0 0;font-variant-numeric:tabular-nums}
.antes{font-size:14px;color:var(--gris);text-decoration:line-through;margin-left:8px;font-weight:500}
.tag{display:inline-block;background:var(--verde);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;margin-top:8px}
#ppBotones{margin-top:18px;min-height:110px}
.usd{font-size:12px;color:var(--gris);text-align:center;margin:10px 0 0}
.estado{font-size:14.5px;font-weight:600;min-height:20px;margin:10px 0 0;text-align:center}
.ayuda{font-size:13px;color:var(--gris);text-align:center;margin:16px 0 0}
.ayuda a{color:var(--azul);font-weight:600}
.listo{text-align:center;padding:10px 4px}
.listo h1{font-size:22px;margin:8px 0}
.listo p{color:var(--gris);font-size:14.5px;line-height:1.55}
.ok{width:56px;height:56px;border-radius:50%;background:#E7F6EF;display:grid;place-items:center;margin:0 auto}
.ok svg{width:30px;height:30px;stroke:var(--verde);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mal{color:var(--rojo)}
.seg{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--gris);margin-top:14px}
.seg svg{width:14px;height:14px;stroke:var(--gris);fill:none;stroke-width:2}
</style>
</head>
<body>
<div class="barra"><span class="marca"><span class="j">JAYE</span><span class="g">GROUP</span></span></div>
<main class="marco">
  <div class="card" id="caja"><p class="estado">Cargando tu pedido…</p></div>
  <p class="seg"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>Pago seguro procesado por PayPal</p>
</main>
<script>
(function () {
  var N8N = 'https://n8n-production-8a42.up.railway.app/webhook/';
  var WA = 'https://wa.me/56964775539?text=' + encodeURIComponent('Hola, tengo una consulta con el pago de mi pedido');
  var caja = document.getElementById('caja');
  var p = new URLSearchParams(location.search).get('p') || '';
  var pesos = function (n) { return '$' + Math.round(Number(n) || 0).toLocaleString('es-CL'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var post = function (ruta, d) { return fetch(N8N + ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }).then(function (r) { return r.json(); }); };
  var ayuda = '<p class="ayuda">¿Prefieres pagar al recibir o tienes una duda? <a href="' + WA + '" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>';
  function pagadoVista(nom) {
    caja.innerHTML = '<div class="listo"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'
      + '<h1>¡Pago recibido!</h1><p>Gracias' + (nom ? ', ' + esc(nom) : '') + '. Tu pedido está pagado y sale con entrega prioritaria. Te escribimos por WhatsApp cuando vaya en camino.</p></div>';
  }
  function error(msg) { caja.innerHTML = '<p class="estado mal">' + esc(msg) + '</p>' + ayuda; }
  if (!p) return error('Este link no trae un pedido.');
  post('pago-info-cl', { p: p }).then(function (d) {
    if (!d || !d.ok) return error((d && d.motivo ? d.motivo.charAt(0).toUpperCase() + d.motivo.slice(1) : 'No pudimos abrir tu pedido') + '.');
    /* 05-10 ANTICIPO (cliente riesgoso): USD 5 por el link; se descuentan $4.700 y el resto se paga al recibir */
    var ant = d.modo === 'anticipo';
    if (d.pagado && ant) { caja.innerHTML = '<div class="listo"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'
      + '<h1>¡Anticipo recibido!</h1><p>Gracias' + (d.nombre ? ', ' + esc(d.nombre) : '') + '. Tu pedido queda confirmado. Al recibir pagas ' + pesos(d.resto) + '. Te escribimos por WhatsApp cuando vaya en camino.</p></div>'; return; }
    if (d.pagado) return pagadoVista(d.nombre);
    if (ant) d.total = d.anticipo;
    caja.innerHTML = '<div class="prod"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></div>'
      + '<div><b>' + esc(d.producto) + (d.cantidad ? ' × ' + esc(d.cantidad) : '') + '</b><small>Pedido JG-' + esc(d.id) + (d.nombre ? ' · ' + esc(d.nombre) : '') + '</small></div></div>'
      + (ant
        ? '<p class="rot">Anticipo para despachar tu pedido</p><p class="total">USD 5</p>'
          + '<p class="rot" style="margin-top:4px">Entre $5.000 y $5.700 según tu banco. Se descuentan $4.700 de tu total: al recibir pagas <b>' + pesos(d.resto) + '</b>.</p>'
        : '<p class="rot">Total a pagar</p><p class="total">' + pesos(d.total) + (d.normal > d.total ? '<span class="antes">' + pesos(d.normal) + '</span>' : '') + '</p>'
          + '<span class="tag">−10 % · entrega prioritaria</span>')
      + '<p class="rot" style="margin-top:12px;color:var(--tinta);font-weight:600">Toca el botón negro «Tarjeta de débito o crédito» y pagas con tu tarjeta.</p>'
      + '<div id="ppBotones"><p class="estado" style="color:var(--gris);font-weight:500">Cargando el pago seguro…</p></div>'
      /* 05-10 James: que se entienda que el "Pagar $17.77" de PayPal son DÓLARES, no un precio raro */
      + (d.usd && !ant ? '<p class="usd" style="font-size:13.5px;color:var(--tinta);background:#FFF7E6;border:1px solid #F5D9A8;border-radius:10px;padding:10px 12px;text-align:left;line-height:1.45">💵 <b>En el botón de PayPal verás «Pagar $' + String(d.usd) + '»: son dólares (USD ' + String(d.usd).replace('.', ',') + '), lo mismo que tus ' + pesos(d.total) + '.</b> Tu banco lo pasa a pesos.</p>' : '')
      + '<p class="estado" id="ppEstado" role="status" aria-live="polite"></p>' + ayuda;
    var msg = function (t, mal) { var e = document.getElementById('ppEstado'); if (e) { e.textContent = t; e.className = 'estado' + (mal ? ' mal' : ''); } };
    var pintar = function () {
      if (!window.paypal || !window.paypal.Buttons) return msg('El pago no cargó. Recarga la página o escríbenos por WhatsApp.', true);
      document.getElementById('ppBotones').innerHTML = '';
      window.paypal.Buttons({
        style: { layout: 'vertical', shape: 'rect', label: 'pay', height: 48 },
        createOrder: function () { msg(''); return post('paypal-orden-cl', { venta_id: d.id }).then(function (j) { if (!j || !j.ok || !j.id) throw new Error((j && j.motivo) || 'sin orden'); return j.id; }); },
        onApprove: function (data) {
          msg('Comprobando el pago…');
          return post('paypal-captura-cl', { venta_id: d.id, order_id: data.orderID }).then(function (j) {
            if (!j || !j.ok) throw new Error((j && j.motivo) || 'no completado');
            if (ant) { caja.innerHTML = '<div class="listo"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>¡Anticipo recibido!</h1><p>Gracias' + (d.nombre ? ', ' + esc(d.nombre) : '') + '. Tu pedido queda confirmado. Al recibir pagas ' + pesos(d.resto) + '. Te escribimos por WhatsApp cuando vaya en camino.</p></div>'; return; }
            pagadoVista(d.nombre);
          }).catch(function () { msg('No pudimos confirmar el pago. Si se te cobró, escríbenos por WhatsApp y lo revisamos al momento.', true); });
        },
        onCancel: function () { msg('No se completó el pago. Puedes intentarlo de nuevo cuando quieras.'); },
        onError: function () { msg('El pago no se pudo iniciar. Inténtalo de nuevo o escríbenos por WhatsApp.', true); }
      }).render('#ppBotones');
    };
    var s = document.createElement('script');
    s.src = 'https://www.paypal.com/sdk/js?client-id=BAAtjPqP0U5V9dZpJsXj6mLe2pqj4TrR4lp7LIVFX7eziKlAtoHpcWSSr9-IURZxFNC1mEyYrYIEJ0YR8A&currency=USD&intent=capture&components=buttons&locale=es_CL';
    s.onload = pintar; s.onerror = pintar; document.head.appendChild(s);
  }).catch(function () { error('No pudimos abrir tu pedido. Revisa tu conexión e inténtalo de nuevo.'); });
})();
</script>
</body>
</html>
